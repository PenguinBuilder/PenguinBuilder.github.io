<!DOCTYPE html>
<html>

<head>
    {{> include-head path=""}}
    <link rel="stylesheet" type="text/css" href="home/style.scss" />
</head>

<body>
    {{> top-bar path=""}}
    <div id="box">
        <div id="main">
            <img src="./favicon.ico" width=500>
            <h1 style="color:white;">PenguinBuilder</h1>
            <h2 id="tag">A Scratch Extension Maker</h2>
            <div id="buttons">
                <sl-tooltip content="Editor">
                    <a href="editor/">
                        <sl-button size="large">Editor</sl-button>
                    </a>
                </sl-tooltip>
                <sl-tooltip content="Docs">
                    <a href="Docs/">
                        <sl-button size="large">Docs</sl-button>
                    </a>
                </sl-tooltip>
            </div>
            <div>
                <div style="margin-left:20px;display:inline-block;">
                    <div style="width: 100%; text-align: center; font-size: 3em;color:white;">Multiple Styles</div>
                    <div class="bg">
                        <img src="./images/example.gif" width=400>
                    </div>
                </div>
                <div style="margin-left:20px;display:inline-block;">
                    <div
                        style="width: 100%; text-align: center;transform: translateY(25px); font-size: 3em; color:white;">
                        Current Style</div>
                    <div class="bg" style="display:inline-block;height:575px;transform: translateY(25px);">
                        <img src="./images/example.json" width=300 style="display: block;">
                    </div>

                </div>
            </div>
        </div>
    </div>
    <div id="block-editor"></div>
</body>
<script src="home/main.ts" type="module"></script>

</html>
